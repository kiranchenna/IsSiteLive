services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-28743}:28743"
    env_file:
      - ./backend/.env
    volumes:
      - issitelive-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:28743}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  issitelive-data:
